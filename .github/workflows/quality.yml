name: quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt

      - name: Encoding health
        run: python scripts/check_encoding_health.py

      - name: Pyright
        run: pyright xpath_explorer tests scripts "xpath 조사기(모든 티켓 사이트).py"

      - name: Pytest
        run: pytest -q -m "not qt"
